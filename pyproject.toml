[project]
name = "firefox-ci-playground"
version = "0.1.0"
description = ""
requires-python = ">=3.10"
authors = [
  { name = " Mozilla Release Engineering ", email = " release+firefox-ci-playground@mozilla.com " }
]
classifiers = [
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]
readme = "README.md"

[dependency-groups]
dev = [
  "coverage",
  "pyright",
  "pytest",
  "pytest-mock",
  "responses",
  "sphinx",
  "sphinx-autobuild",
  "sphinx-book-theme",
  "tox",
]

[tool.pytest.ini_options]
xfail_strict = true

[tool.coverage.run]
parallel = true
branch = true
source = ["src/firefox_ci_playground/"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "PLC", "PLE",   # pylint
    "UP",           # pyupgrade
    "TCH",          # flake8-type-checking
]
ignore = [
    "E501",  # let ruff-format handle line-length
]

[tool.ruff.isort]
known-first-party = ["firefox_ci_playground"]

[tool.pyright]
include = ["src/firefox_ci_playground"]
reportUnknownParameterType = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
