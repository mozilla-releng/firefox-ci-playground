[project]
name = "sample-project"
version = "0.1.0"
description = "Sample project"
requires-python = ">=3.9"
authors = [
  { name = " Mozilla Release Engineering ", email = " release+sample-project@mozilla.com " }
]
classifiers = [
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]
readme = "README.md"

[dependency-groups]
dev = [
  "coverage",
  "pyright",
  "pytest",
  "pytest-mock",
  "responses",
  "sphinx",
  "sphinx-autobuild",
  "sphinx-book-theme",
  "tox",
]

[tool.pytest.ini_options]
xfail_strict = true

[tool.coverage.run]
parallel = true
branch = true
source = ["src/sample_project/"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "PLC", "PLE",   # pylint
    "UP",           # pyupgrade
    "TCH",          # flake8-type-checking
]
ignore = [
    "E501",  # let ruff-format handle line-length
]

[tool.ruff.isort]
known-first-party = ["sample_project"]

[tool.pyright]
include = ["src/sample_project"]
reportUnknownParameterType = "error"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
