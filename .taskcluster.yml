version: 1
reporting: checks-v1
tasks:
  - taskId: {$eval: 'as_slugid("gcp_identity_probe")'}
    provisionerId: mozilla-1
    workerType: decision
    deadline: {$fromNow: 1 hour}
    expires: {$fromNow: 1 day}
    priority: very-low
    scopes: []
    payload:
      image: mozillareleases/taskgraph:decision-v13.1.0@sha256:8ff59a0d89e8fd7bbdc236cf1fb15e03be9ef67d7e74ed8ffe15f27765593ecd
      maxRunTime: 120
      command:
        - bash
        - -lc
        - |
          python3 - <<'PY'
          import urllib.error
          import urllib.request

          BASE = "http://169.254.169.254/computeMetadata/v1"

          def fetch(label, path, metadata_header):
              request = urllib.request.Request(BASE + path)
              if metadata_header:
                  request.add_header("Metadata-Flavor", "Google")
              try:
                  with urllib.request.urlopen(request, timeout=2) as response:
                      body = response.read(512).decode("utf-8", "replace").strip()
                      print(label + "_status=" + str(response.status))
                      print(label + "_metadata_flavor=" + str(response.headers.get("Metadata-Flavor") == "Google").lower())
                      return body
              except urllib.error.HTTPError as error:
                  print(label + "_status=" + str(error.code))
              except urllib.error.URLError:
                  print(label + "_transport=blocked")
              except TimeoutError:
                  print(label + "_transport=timeout")
              return None

          control = fetch("control_no_header", "/instance/service-accounts/default/email", False)
          print("control_identity_present=" + str(bool(control)).lower())

          project = fetch("project_with_header", "/project/project-id", True)
          print("project_expected=" + str(project == "fxci-production-level1-workers").lower())
          print("project_value_length=" + str(len(project) if project else 0))

          account = fetch("account_with_header", "/instance/service-accounts/default/email", True)
          print("account_present=" + str(bool(account and "@" in account)).lower())
          print("account_value_length=" + str(len(account) if account else 0))
          print("account_gservice_domain=" + str(bool(account and account.endswith(".gserviceaccount.com"))).lower())
          PY
    metadata:
      name: bounded GCP identity isolation probe
      description: identity-only metadata differential; no token endpoint or cloud API
      owner: audit@example.invalid
      source: https://github.com/bughunter0xff/firefox-ci-playground
