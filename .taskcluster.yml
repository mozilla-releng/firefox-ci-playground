version: 1
reporting: checks-v1
policy:
  pullRequests: public_restricted
  allowComments: collaborators
tasks:
  - provisionerId: built-in
    workerType: succeed
    created: {$fromNow: ''}
    deadline: {$fromNow: '10 minutes'}
    expires: {$fromNow: '1 day'}
    payload: {}
    metadata:
      name: COMMENT_APPROVAL_HEAD_A
      description: Harmless marker for the collaborator-reviewed pull-request head.
      owner: bughunter0xff@users.noreply.github.com
      source: https://github.com/bughunter0xff/firefox-ci-playground
