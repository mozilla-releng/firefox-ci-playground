version: 1
reporting: checks-v1
tasks:
  - taskId: {$eval: 'as_slugid("gcp_authority_probe")'}
    provisionerId: mozilla-1
    workerType: decision
    deadline: {$fromNow: 1 hour}
    expires: {$fromNow: 1 day}
    priority: very-low
    scopes: []
    payload:
      image: mozillareleases/taskgraph:decision-v13.1.0@sha256:8ff59a0d89e8fd7bbdc236cf1fb15e03be9ef67d7e74ed8ffe15f27765593ecd
      maxRunTime: 120
      command:
        - bash
        - -lc
        - |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          METADATA = "http://169.254.169.254/computeMetadata/v1"
          PROJECT = "fxci-production-level1-workers"
          PROJECT_TEST = "https://cloudresourcemanager.googleapis.com/v1/projects/" + PROJECT + ":testIamPermissions"

          PROJECT_PERMISSIONS = [
              "resourcemanager.projects.get",
              "resourcemanager.projects.getIamPolicy",
              "resourcemanager.projects.setIamPolicy",
              "compute.instances.create",
              "compute.instances.delete",
              "compute.instances.get",
              "compute.instances.list",
              "compute.instances.setMetadata",
              "compute.instances.setServiceAccount",
              "compute.disks.create",
              "compute.images.create",
              "compute.instanceTemplates.create",
              "secretmanager.secrets.get",
              "secretmanager.versions.access",
              "storage.buckets.get",
              "storage.objects.get",
              "storage.objects.create",
              "logging.logEntries.create",
              "monitoring.timeSeries.create",
              "serviceusage.services.use",
          ]
          ACCOUNT_PERMISSIONS = [
              "iam.serviceAccounts.actAs",
              "iam.serviceAccounts.getAccessToken",
              "iam.serviceAccounts.getOpenIdToken",
              "iam.serviceAccounts.signBlob",
              "iam.serviceAccounts.signJwt",
          ]
          SECRET_PERMISSIONS = [
              "secretmanager.secrets.get",
              "secretmanager.versions.access",
              "secretmanager.versions.list",
          ]

          def metadata(path):
              request = urllib.request.Request(METADATA + path)
              request.add_header("Metadata-Flavor", "Google")
              try:
                  with urllib.request.urlopen(request, timeout=2) as response:
                      return response.status, response.read(4096)
              except urllib.error.HTTPError as error:
                  return error.code, None
              except (urllib.error.URLError, TimeoutError):
                  return 0, None

          def test_permissions(url, candidates, credential):
              body = json.dumps({"permissions": candidates}).encode("utf-8")
              request = urllib.request.Request(url, data=body, method="POST")
              request.add_header("Content-Type", "application/json")
              if credential:
                  request.add_header("Authorization", "Bearer " + credential)
              try:
                  with urllib.request.urlopen(request, timeout=2) as response:
                      document = json.loads(response.read(8192))
                      returned = document.get("permissions", [])
                      returned = sorted(item for item in returned if item in candidates)
                      return response.status, returned
              except urllib.error.HTTPError as error:
                  return error.code, []
              except (urllib.error.URLError, TimeoutError, ValueError):
                  return 0, []

          control_status, control_permissions = test_permissions(PROJECT_TEST, PROJECT_PERMISSIONS, None)
          print("control_status=" + str(control_status))
          print("control_permissions_count=" + str(len(control_permissions)))

          account_status, account_body = metadata("/instance/service-accounts/default/email")
          token_status, token_body = metadata("/instance/service-accounts/default/token")
          credential = None
          token_type_ok = False
          expiry_one_hour = False
          if token_body:
              try:
                  token_document = json.loads(token_body)
                  credential = token_document.pop("access_token", None)
                  token_type_ok = token_document.get("token_type") == "Bearer"
                  expires_in = token_document.get("expires_in")
                  expiry_one_hour = isinstance(expires_in, int) and 3000 <= expires_in <= 3700
                  token_document.clear()
              except (ValueError, TypeError):
                  credential = None
          token_body = None
          print("account_status=" + str(account_status))
          print("token_status=" + str(token_status))
          print("credential_present=" + str(bool(credential)).lower())
          print("token_type_ok=" + str(token_type_ok).lower())
          print("expiry_one_hour=" + str(expiry_one_hour).lower())

          if credential and account_body:
              account = account_body.decode("utf-8", "replace").strip()
              account_body = None
              account_resource = urllib.parse.quote(account, safe="")
              account_test = "https://iam.googleapis.com/v1/projects/" + PROJECT + "/serviceAccounts/" + account_resource + ":testIamPermissions"
              secret_test = "https://secretmanager.googleapis.com/v1/projects/" + PROJECT + "/secrets/cot:testIamPermissions"

              project_status, project_permissions = test_permissions(PROJECT_TEST, PROJECT_PERMISSIONS, credential)
              account_test_status, account_permissions = test_permissions(account_test, ACCOUNT_PERMISSIONS, credential)
              secret_status, secret_permissions = test_permissions(secret_test, SECRET_PERMISSIONS, credential)

              print("project_test_status=" + str(project_status))
              print("project_permissions=" + ",".join(project_permissions))
              print("account_test_status=" + str(account_test_status))
              print("account_permissions=" + ",".join(account_permissions))
              print("secret_test_status=" + str(secret_status))
              print("secret_permissions=" + ",".join(secret_permissions))
          else:
              print("permission_tests_skipped=true")

          credential = None
          PY
    metadata:
      name: bounded GCP effective-authority probe
      description: non-mutating permission evaluation; authentication material never emitted
      owner: audit@example.invalid
      source: https://github.com/bughunter0xff/firefox-ci-playground
