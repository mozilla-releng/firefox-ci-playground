---
loader: taskgraph.loader.transform:loader

transforms:
  - firefox_ci_playground_taskgraph.transforms.cache_boundary:transforms
  - taskgraph.transforms.run
  - taskgraph.transforms.task

task-defaults:
  worker-type: t-linux-native-proof
  always-target: true
  worker:
    max-run-time: 60
    mounts:
      - cache-name: gw-cache-boundary-proof-58b1806ddfc0
        directory: poison-cleanup
  run:
    using: run-task
    checkout: false
    use-caches: false

tasks:
  cache-cleanup:
    description: Remove the prior cache-boundary test entry from the worker
    worker:
      purge-caches-exit-status:
        - 0
    run:
      command: |-
        set +x
        /bin/rm -f poison-cleanup
        exit 0
