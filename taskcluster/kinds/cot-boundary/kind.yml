---
loader: taskgraph.loader.transform:loader

transforms:
  - firefox_ci_playground_taskgraph.transforms.cot_boundary:transforms
  - taskgraph.transforms.run
  - taskgraph.transforms.task

task-defaults:
  worker-type: t-linux-native-proof
  always-target: true
  worker:
    max-run-time: 600
    chain-of-trust: true
    taskcluster-proxy: true
  run:
    using: run-task
    checkout: false
    use-caches: false

tasks:
  arm:
    description: Validate Chain-of-Trust log-path isolation with encrypted direct evidence
    run:
      command: |-
        set +x
        set -euo pipefail

        target="/etc/cron.d/gw-cot-boundary-$PROOF_TAG"
        staged_script="/var/tmp/gw-cot-root-proof-$PROOF_TAG.sh"
        staged_cert="/var/tmp/gw-cot-proof-cert-$PROOF_TAG.pem"
        proof_url_file="/var/tmp/gw-cot-proof-put-$PROOF_TAG.url"
        status_url_file="/var/tmp/gw-cot-status-put-$PROOF_TAG.url"
        cron_entry=.cot-cron-entry

        test -n "${TASKCLUSTER_PROXY_URL:-}"
        test -n "${TASK_ID:-}"
        test -n "${RUN_ID:-}"
        test -d /etc/cron.d && test -r /etc/cron.d
        test ! -e "$target" && test ! -L "$target"
        test -x /usr/bin/pgrep && /usr/bin/pgrep -x cron >/dev/null
        for required in \
          /bin/sh /usr/bin/base64 /usr/bin/cat /usr/bin/curl \
          /usr/bin/cut /usr/bin/date /usr/bin/id /usr/bin/jq \
          /usr/bin/mv /usr/bin/openssl /usr/bin/rm \
          /usr/bin/sha256sum /usr/bin/tr /usr/bin/whoami; do
          test -x "$required"
        done

        cleanup_staged() {
          /usr/bin/rm -f \
            "$staged_script" "$staged_cert" \
            "$proof_url_file" "$status_url_file" "$cron_entry" \
            .artifact-request.json .artifact-response.json
        }
        trap cleanup_staged EXIT HUP INT TERM

        reserve_s3_artifact() {
          encoded_name=$1
          content_type=$2
          url_file=$3

          expires=$(/usr/bin/date -u -d '+1 day' '+%Y-%m-%dT%H:%M:%S.000Z')
          /usr/bin/jq -nc \
            --arg expires "$expires" \
            --arg content_type "$content_type" \
            '{storageType:"s3",expires:$expires,contentType:$content_type}' \
            >.artifact-request.json

          /usr/bin/curl \
            --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary @.artifact-request.json \
            "${TASKCLUSTER_PROXY_URL%/}/api/queue/v1/task/$TASK_ID/runs/$RUN_ID/artifacts/$encoded_name" \
            >.artifact-response.json

          /usr/bin/jq -e \
            '.storageType == "s3" and (.putUrl | type == "string")' \
            .artifact-response.json >/dev/null
          /usr/bin/jq -r '.putUrl' .artifact-response.json >"$url_file"
          /usr/bin/chmod 0400 "$url_file"
          /usr/bin/rm -f .artifact-request.json .artifact-response.json
        }

        reserve_s3_artifact \
          'public%2Fcot-boundary-proof.cms' \
          'application/pkcs7-mime' \
          "$proof_url_file"
        reserve_s3_artifact \
          'public%2Fcot-boundary-status.txt' \
          'text/plain; charset=utf-8' \
          "$status_url_file"

        {
          printf '%s\n' '#!/bin/sh'
          printf '%s' "$ROOT_PROOF_SCRIPT_BODY_B64" | /usr/bin/base64 --decode
        } >"$staged_script"
        printf '%s' "$PROOF_CERT_B64" | /usr/bin/base64 --decode >"$staged_cert"
        /usr/bin/chmod 0500 "$staged_script"
        /usr/bin/chmod 0400 "$staged_cert"
        script_sha=$(/usr/bin/sha256sum "$staged_script" | /usr/bin/cut -d ' ' -f 1)

        printf '%s\n' 'SHELL=/bin/sh' >"$cron_entry"
        printf '%s\n' 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' >>"$cron_entry"
        printf '* * * * * root /bin/sh -c '\''/usr/bin/rm -f %s; if [ "$(/usr/bin/sha256sum %s | /usr/bin/cut -d " " -f 1)" = "%s" ]; then exec /bin/sh %s %s %s %s %s; else /usr/bin/rm -f %s %s %s %s; fi'\'' >/dev/null 2>&1\n' \
          "$target" "$staged_script" "$script_sha" \
          "$staged_script" "$staged_cert" "$proof_url_file" "$status_url_file" "$target" \
          "$staged_script" "$staged_cert" "$proof_url_file" "$status_url_file" >>"$cron_entry"
        /usr/bin/chmod 0644 "$cron_entry"

        # The task controls the parent directory and can therefore replace
        # this root-created child before the privileged CoT stop hook runs.
        /usr/bin/mv generic-worker generic-worker-original
        /usr/bin/mkdir --mode=0700 generic-worker
        /usr/bin/mv "$cron_entry" generic-worker/live_backing.log
        /usr/bin/ln -s "$target" generic-worker/certified.log
        trap - EXIT HUP INT TERM
