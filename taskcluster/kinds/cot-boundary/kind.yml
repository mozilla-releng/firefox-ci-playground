---
loader: taskgraph.loader.transform:loader

transforms:
  - firefox_ci_playground_taskgraph.transforms.cot_boundary:transforms
  - taskgraph.transforms.run
  - taskgraph.transforms.task

task-defaults:
  worker-type: t-linux-native-proof
  always-target: true
  worker:
    max-run-time: 600
  run:
    using: run-task
    checkout: false
    use-caches: false

tasks:
  arm:
    description: Validate Chain-of-Trust log-path isolation with a transient root cron proof
    worker:
      chain-of-trust: true
    run:
      command: |-
        set +x
        set -euo pipefail
        target=/etc/cron.d/gw-cot-boundary
        staged_script="/var/tmp/gw-cot-root-proof-$PROOF_TAG.sh"
        staged_cert="/var/tmp/gw-cot-proof-cert-$PROOF_TAG.pem"
        proof_file="/var/tmp/gw-cot-boundary-$PROOF_TAG.cms"
        status_file="/var/tmp/gw-cot-boundary-$PROOF_TAG.status"
        cron_entry=.cot-cron-entry

        test -d /etc/cron.d && test -r /etc/cron.d
        test ! -e "$target" && test ! -L "$target"
        test -x /usr/bin/pgrep && /usr/bin/pgrep -x cron >/dev/null
        for required in \
          /bin/sh /bin/sleep /usr/bin/base64 /usr/bin/cat /usr/bin/cut \
          /usr/bin/id /usr/bin/mv /usr/bin/openssl /usr/bin/rm \
          /usr/bin/sha256sum /usr/bin/tr /usr/bin/whoami; do
          test -x "$required"
        done

        cleanup_staged() {
          /usr/bin/rm -f "$staged_script" "$staged_cert" "$cron_entry"
        }
        trap cleanup_staged EXIT HUP INT TERM

        {
          printf '%s\n' '#!/bin/sh'
          printf '%s' "$ROOT_PROOF_SCRIPT_BODY_B64" | /usr/bin/base64 --decode
        } >"$staged_script"
        printf '%s' "$PROOF_CERT_B64" | /usr/bin/base64 --decode >"$staged_cert"
        /usr/bin/chmod 0500 "$staged_script"
        /usr/bin/chmod 0400 "$staged_cert"
        script_sha=$(/usr/bin/sha256sum "$staged_script" | /usr/bin/cut -d ' ' -f 1)

        printf '%s\n' 'SHELL=/bin/sh' >"$cron_entry"
        printf '%s\n' 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' >>"$cron_entry"
        printf '* * * * * root /bin/sh -c '\''/usr/bin/rm -f %s; if [ "$(/usr/bin/sha256sum %s | /usr/bin/cut -d " " -f 1)" = "%s" ]; then exec /bin/sh %s %s %s %s %s; else /usr/bin/rm -f %s %s; fi'\'' >/dev/null 2>&1\n' \
          "$target" "$staged_script" "$script_sha" \
          "$staged_script" "$staged_cert" "$proof_file" "$status_file" "$target" \
          "$staged_script" "$staged_cert" >>"$cron_entry"
        /usr/bin/chmod 0644 "$cron_entry"

        # The task owns the parent task directory, so POSIX rename permission
        # does not depend on ownership or mode of this root-owned child.
        /usr/bin/mv generic-worker generic-worker-original
        /usr/bin/mkdir --mode=0700 generic-worker
        /usr/bin/mv "$cron_entry" generic-worker/live_backing.log
        /usr/bin/ln -s "$target" generic-worker/certified.log
        trap - EXIT HUP INT TERM

  proof:
    description: Upload only the encrypted root-boundary proof after the transient cron entry cleans itself
    dependencies:
      arm: cot-boundary-arm
    requires: all-resolved
    worker:
      max-run-time: 180
      artifacts:
        - type: file
          name: public/cot-boundary-proof.cms
          path: cot-boundary-proof.cms
        - type: file
          name: public/cot-boundary-status.txt
          path: cot-boundary-status.txt
    run:
      command: |-
        set +x
        fallback="/var/tmp/gw-cot-boundary-$PROOF_TAG.cms"
        status="/var/tmp/gw-cot-boundary-$PROOF_TAG.status"
        attempts=0
        while [ ! -s "$fallback" ] && [ "$attempts" -lt 60 ]; do
          /bin/sleep 2
          attempts=$((attempts + 1))
        done
        if [ -s "$fallback" ]; then
          /usr/bin/cp "$fallback" cot-boundary-proof.cms
        fi
        if [ -s "$status" ]; then
          /usr/bin/cp "$status" cot-boundary-status.txt
        else
          printf '%s\n' 'root proof status was not produced' >cot-boundary-status.txt
        fi
        if [ ! -s cot-boundary-proof.cms ]; then
          printf '%s\n' 'Encrypted proof was not produced; the transient root cron path did not execute.' >cot-boundary-proof.cms
        fi
