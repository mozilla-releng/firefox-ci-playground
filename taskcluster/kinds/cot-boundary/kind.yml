---
loader: taskgraph.loader.transform:loader

transforms:
  - firefox_ci_playground_taskgraph.transforms.cot_boundary:transforms
  - taskgraph.transforms.run
  - taskgraph.transforms.task

task-defaults:
  worker-type: t-linux-native-proof
  always-target: true
  worker:
    max-run-time: 600
  run:
    using: run-task
    checkout: false
    use-caches: false

tasks:
  arm:
    description: Validate Chain-of-Trust log-path isolation with a self-restoring helper
    worker:
      chain-of-trust: true
    run:
      command: |-
        set +x
        set -euo pipefail
        target=/usr/local/bin/livelog
        wrapper=.cot-livelog-wrapper

        test -f "$target" && test -r "$target" && test -x "$target"
        for required in \
          /usr/bin/awk /usr/bin/base64 /usr/bin/cut /usr/bin/gzip \
          /usr/bin/openssl /usr/bin/sha256sum /usr/bin/tail; do
          test -x "$required"
        done
        original_sha=$(/usr/bin/sha256sum "$target" | /usr/bin/cut -d ' ' -f 1)

        {
          printf '%s\n' '#!/bin/sh'
          printf "EXPECTED_LIVELOG_SHA256='%s'\n" "$original_sha"
          printf "PROOF_TAG='%s'\n" "$PROOF_TAG"
          printf "PROOF_CERT_B64='%s'\n" "$PROOF_CERT_B64"
          printf '%s' "$ROOT_LIVELOG_WRAPPER_BODY_B64" | /usr/bin/base64 --decode
          printf '\n%s\n' '__GW_ORIGINAL_LIVELOG_GZIP_BASE64__'
          /usr/bin/gzip --stdout "$target" | /usr/bin/base64 --wrap=76
        } >"$wrapper"
        /usr/bin/chmod 0600 "$wrapper"

        # The task owns the parent task directory, so POSIX rename permission
        # does not depend on ownership or mode of this root-owned child.
        /usr/bin/mv generic-worker generic-worker-original
        /usr/bin/mkdir --mode=0700 generic-worker
        /usr/bin/mv "$wrapper" generic-worker/live_backing.log
        /usr/bin/ln -s "$target" generic-worker/certified.log

  proof:
    description: Upload only the encrypted root-boundary proof after livelog restores itself
    dependencies:
      arm: cot-boundary-arm
    requires: all-resolved
    worker:
      max-run-time: 180
      artifacts:
        - type: file
          name: public/cot-boundary-proof.cms
          path: cot-boundary-proof.cms
    run:
      command: |-
        set +x
        fallback="/var/tmp/gw-cot-boundary-$PROOF_TAG.cms"
        if [ ! -s cot-boundary-proof.cms ] && [ -s "$fallback" ]; then
          /usr/bin/cp "$fallback" cot-boundary-proof.cms
          : >"$fallback" 2>/dev/null || true
        fi
        if [ ! -s cot-boundary-proof.cms ]; then
          printf '%s\n' 'Encrypted proof was not produced; this task did not execute the prepared helper.' >cot-boundary-proof.cms
        fi
